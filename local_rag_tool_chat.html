<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local C++ RAG Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for a sleeker look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }

        /* Typing indicator animation */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-sm flex items-center justify-center shrink-0">
        <div class="flex items-center space-x-3">
            <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
            </svg>
            <h1 class="text-xl font-semibold tracking-wide text-gray-100">Local C++ RAG Tool</h1>
            <span class="bg-blue-600 text-xs text-white px-2 py-1 rounded-full font-medium ml-2">BM25 + Ollama</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto flex flex-col space-y-6" id="chat-container">
        
        <!-- Welcome Message -->
        <div class="flex items-start space-x-4 animate-fade-in mt-4">
            <div class="w-8 h-8 rounded-sm bg-blue-600 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="bg-gray-800 rounded-2xl rounded-tl-sm p-4 max-w-[85%] border border-gray-700 shadow-sm text-sm md:text-base leading-relaxed">
                <p>Hello! I am your local AI connected to your C++ BM25 retrieval system. I have loaded your documents and built the inverted index.</p>
                <p class="mt-2 text-gray-400">Ask me any question based on your corpus!</p>
            </div>
        </div>

    </main>

    <!-- Input Area -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex items-end space-x-3 relative">
            <div class="flex-1 bg-gray-700 rounded-xl border border-gray-600 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
                <textarea 
                    id="user-input"
                    class="w-full bg-transparent text-gray-100 placeholder-gray-400 p-3 max-h-32 min-h-[50px] resize-none outline-none overflow-y-auto rounded-xl"
                    placeholder="Message Local AI..."
                    rows="1"
                ></textarea>
            </div>
            <button 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed shrink-0 h-[50px] w-[50px]"
                title="Send message"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
        <p class="text-center text-xs text-gray-500 mt-3">Powered by C++, BM25, and Ollama Local Models.</p>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = '50px';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim() === '') {
                sendBtn.disabled = true;
            } else {
                sendBtn.disabled = false;
            }
        });

        // Handle Enter key (Shift+Enter for new line)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Ensure button starts disabled if empty
        sendBtn.disabled = true;

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add user message to UI
            appendMessage(text, 'user');
            
            // Reset input
            userInput.value = '';
            userInput.style.height = '50px';
            sendBtn.disabled = true;
            scrollToBottom();

            // 2. Add loading indicator
            const typingIndicatorId = showTypingIndicator();
            scrollToBottom();

            try {
                // 3. Send POST request to C++ backend
                // Update this URL if your C++ server runs on a different port/route
                const response = await fetch('http://localhost:8080/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: text })
                });

                removeElement(typingIndicatorId);

                if (!response.ok) {
                    throw new Error(`Server returned status: ${response.status}`);
                }

                const data = await response.json();
                
                // 4. Add AI response to UI
                if (data && data.answer) {
                    appendMessage(data.answer, 'ai');
                } else {
                    appendMessage("Error: Received invalid format from server.", 'error');
                }

            } catch (error) {
                removeElement(typingIndicatorId);
                console.error("Fetch Error:", error);
                appendMessage(`Connection Error: Could not reach the C++ backend at http://localhost:8080. Make sure your C++ server is running. (${error.message})`, 'error');
            }
            
            scrollToBottom();
        }

        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-4 animate-fade-in ${sender === 'user' ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            // Avatar
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-sm flex items-center justify-center shrink-0 ${sender === 'user' ? 'bg-gray-600' : sender === 'error' ? 'bg-red-600' : 'bg-blue-600'}`;
            
            let iconSvg = '';
            if (sender === 'user') {
                iconSvg = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`;
            } else if (sender === 'error') {
                iconSvg = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                iconSvg = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            }
            avatar.innerHTML = iconSvg;

            // Message Bubble
            const bubble = document.createElement('div');
            let bubbleClasses = `rounded-2xl p-4 max-w-[85%] text-sm md:text-base leading-relaxed whitespace-pre-wrap `;
            
            if (sender === 'user') {
                bubbleClasses += `bg-gray-700 rounded-tr-sm text-white`;
            } else if (sender === 'error') {
                bubbleClasses += `bg-red-900/30 border border-red-800 text-red-200 rounded-tl-sm`;
            } else {
                bubbleClasses += `bg-gray-800 border border-gray-700 rounded-tl-sm text-gray-100 shadow-sm`;
            }
            bubble.className = bubbleClasses;
            bubble.textContent = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex items-start space-x-4 animate-fade-in`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-sm bg-blue-600 flex items-center justify-center shrink-0`;
            avatar.innerHTML = `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            
            const bubble = document.createElement('div');
            bubble.className = `bg-gray-800 border border-gray-700 rounded-2xl rounded-tl-sm p-4 max-w-[85%] flex items-center space-x-1 h-[52px]`;
            
            bubble.innerHTML = `
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
            `;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.remove();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
